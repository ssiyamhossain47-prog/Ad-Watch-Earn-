<script>

/* DATA */

/* MODIFIED: Removed unused variables related to the timer UI flow */
let pending = 0;
let withdrawBalance = 0;
let adsWatched = 0;

/* LOAD USER DATA */

function loadData(){

document.getElementById("pendingMoney").innerText =
pending + " TK";

document.getElementById("withdrawMoney").innerText =
withdrawBalance + " TK";

document.getElementById("adsWatched").innerText =
adsWatched;

}

/* REGISTER */

function register(){

let email =
document.getElementById("email").value;

let pass =
document.getElementById("pass").value;

auth.createUserWithEmailAndPassword(email,pass)

.then((user)=>{

db.ref("users/"+user.user.uid).set({

email:email,
pending:0,
withdrawBalance:0,
adsWatched:0

});

user.user.sendEmailVerification();

alert("Registration Success");

})

.catch((error)=>{

alert(error.message);

});

}

/* LOGIN */

function login(){

let email =
document.getElementById("email").value;

let pass =
document.getElementById("pass").value;

auth.signInWithEmailAndPassword(email,pass)

.catch((error)=>{

alert(error.message);

});

}

/* LOGOUT */

function logout(){

auth.signOut();

}

/* AUTH */

auth.onAuthStateChanged((user)=>{

if(user){

document.getElementById("authPage").style.display =
"none";

document.getElementById("app").style.display =
"block";

document.getElementById("userEmail").innerText =
user.email;

document.getElementById("userName").innerText =
user.email.split("@")[0];

db.ref("users/"+user.uid).on("value",(snap)=>{

let data = snap.val();

if(data){

pending = data.pending || 0;

withdrawBalance =
data.withdrawBalance || 0;

adsWatched =
data.adsWatched || 0;

loadData();

}

});

}else{

document.getElementById("authPage").style.display =
"block";

document.getElementById("app").style.display =
"none";

}

});

/* HOME */

function goHome(){

document.getElementById("home").style.display =
"block";

document.getElementById("ads").style.display =
"none";

document.getElementById("withdraw").style.display =
"none";

/* MODIFIED: Removed references to hidden watch view */

}

/* SHOW ADS */

function showAds(){

document.getElementById("home").style.display =
"none";

document.getElementById("ads").style.display =
"block";

let box =
document.getElementById("adList");

box.innerHTML = "";

/* FIREBASE ADS */

db.ref("ads").once("value").then((snap)=>{

let data = snap.val();

if(data){

for(let id in data){

let ad = data[id];

let d = document.createElement("div");

d.className = "adBox";

d.innerHTML = `
🎥 ${ad.title}<br><br>
💰 Earn ${ad.reward} TK<br>
⏰ ${ad.time} Sec
`;

/* MODIFIED: When user taps an Ad card, immediately open the ad URL stored in Firebase and credit the reward */
d.onclick = function(){

window.open(ad.link, "_blank");

pending += Number(ad.reward || 0);
adsWatched++;

db.ref("users/"+auth.currentUser.uid).update({
pending: pending,
adsWatched: adsWatched
});

alert(ad.reward + " TK Added");

};

box.appendChild(d);

}

}else{

box.innerHTML = `
<div class="notice">
No Ads Available
</div>
`;

}

});

}

/* MODIFIED: openWatch, openRealAd, and finish functions removed since watch flow is eliminated */

/* OPEN WITHDRAW */

function openWithdraw(){

document.getElementById("home").style.display =
"none";

document.getElementById("ads").style.display =
"none";

document.getElementById("withdraw").style.display =
"block";

}
/* SUBMIT WITHDRAW */

function submitWithdraw(){

let name =
document.getElementById("wname").value;

let amount =
parseInt(
document.getElementById("wamount").value
);

let method =
document.getElementById("wmethod").value;

let number =
document.getElementById("wnumber").value;

if(!name || !amount || !method || !number){

alert("সব তথ্য পূরণ করো");

return;

}

if(amount < 50){

alert("50 টাকার নিচে Withdraw হবে না");

return;

}

if(amount > withdrawBalance){

alert("তোমার কাছে এত টাকা নাই");

return;

}

withdrawBalance -= amount;

db.ref("users/"+auth.currentUser.uid).update({

withdrawBalance:withdrawBalance

});

db.ref("withdrawRequests").push({

name:name,
amount:amount,
method:method,
number:number,
email:auth.currentUser.email,
uid:auth.currentUser.uid,
time:new Date().toString()

});

alert("Withdraw Request Sent");

goHome();

}

</script>
